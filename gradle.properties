# ============================================
# JVM & Performance Tuning
# ============================================

# Give the Gradle daemon plenty of heap space for large builds
org.gradle.jvmargs=-Xmx8192m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enable build parallelism across modules
org.gradle.parallel=true

# Enable the configuration cache (greatly speeds up Gradle sync and incremental builds)
org.gradle.configuration-cache=true

# Enable the Gradle build cache (reuses compiled outputs when inputs are unchanged)
org.gradle.caching=true

# Keep Gradle Daemons alive longer (default is 3h). Useful for frequent builds.
org.gradle.daemon.idletimeout=10800000

# Enable verbose file system logging (helpful for build profiling)
# org.gradle.vfs.verbose=true

# Use reproducible file order in archives for deterministic builds (recommended for CI)
org.gradle.reproducibleFileOrder=true


# ============================================
# Android Build Behavior
# ============================================

# Use AndroidX libraries exclusively
android.useAndroidX=true

# Disable Jetifier (only enable this if using old pre-AndroidX libraries)
android.enableJetifier=false

# Each librarys R class includes only its own resources (smaller & faster builds)
android.nonTransitiveRClass=true

# ============================================
# Kotlin Compiler & Daemon
# ============================================

# Follow official Kotlin code style
kotlin.code.style=official

# Enable incremental Kotlin compilation
kotlin.incremental=true

# Allow parallel Kotlin task execution across modules
kotlin.parallel.tasks.in.project=true

# Give the Kotlin compiler daemon its own generous memory allocation
kotlin.daemon.jvmargs=-Xmx4096m

# Enable build cache for Kotlin (saves compiled classes between builds)
kotlin.caching.enabled=true

# Prefer the IR (Intermediate Representation) backend (required for Compose)
kotlin.useIR=true


# ============================================
# Optional / Quality of Life
# ============================================

# Show detailed warnings
org.gradle.warning.mode=all

# Use rich color output (disable for CI)
org.gradle.console=rich

# Force Gradle to use the daemon (for faster command-line builds)
org.gradle.daemon=true

# Uncomment this if using a multi-CPU workstation (e.g., Ryzen / i9)
# org.gradle.workers.max=8

# Show build scan suggestion (helpful for profiling)
# org.gradle.enterprise.allowUntrustedServer=true
